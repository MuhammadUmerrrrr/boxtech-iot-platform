# BoxTech IoT Platform - credentials.
#
# WARNING: these are the documented DEMO credentials, identical to the ones in
# the repository docker-compose.yml. They are committed so the recruiter demo is
# reproducible. Before any non-demo use, change every value here and rotate the
# ThingsBoard sysadmin password after the first provision run.
#
# To generate a fresh database password instead of the placeholder:
#   oc create secret generic boxtech-secrets -n muhammadumerrrrr-dev \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" ... --dry-run=client -o yaml | oc apply -f -

apiVersion: v1
kind: Secret
metadata:
  name: boxtech-secrets
  labels:
    app.kubernetes.io/part-of: boxtech-iot-platform
type: Opaque
stringData:
  # --- PostgreSQL ---------------------------------------------------------
  POSTGRES_DB: boxtech
  POSTGRES_USER: boxtech
  POSTGRES_PASSWORD: boxtech

  # --- ThingsBoard system administrator ------------------------------------
  # Built-in account created by the schema installer. The provisioner signs in
  # with it to create the tenant. Change the password in the UI after deploy.
  TB_SYSADMIN_EMAIL: sysadmin@thingsboard.org
  TB_SYSADMIN_PASSWORD: sysadmin

  # --- BoxTech demo accounts (used by the provisioner) ----------------------
  BOXTECH_TENANT_PASSWORD: BoxTech@2026
  BOXTECH_CUSTOMER_PASSWORD: Password123!
